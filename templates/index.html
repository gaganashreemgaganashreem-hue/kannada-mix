<!DOCTYPE html>
<html>
<head>
    <title>Kannada Mix</title>
</head>
<body>

    <h1>Kannada Mix Text Converter</h1>

    <form method="POST">

        <label>Enter your text:</label>
        <br><br>

        <input
            type="text"
            name="user_text"
            placeholder="Enter text here"
            required
        >

        <button type="submit">Convert</button>

    </form>

    <h2>Output:</h2>

    <p>{{ output }}</p>

</body>
</html>
